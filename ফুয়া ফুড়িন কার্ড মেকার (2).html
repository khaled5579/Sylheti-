<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ফুয়া ফুড়িন কার্ড মেকার</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&family=Tiro+Bangla&family=Baloo+Da+2:wght@500;700&family=Galada&family=Atma:wght@500;700&family=Noto+Serif+Bengali:wght@500;700&family=Anek+Bangla:wght@500;700&family=Mina:wght@400;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f0f2f5;--panel:#fff;--ink:#1c1e21;--mute:#65676b;--line:#dadde1;--acc:#1877f2;--accInk:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#18191a;--panel:#242526;--ink:#e4e6eb;--mute:#b0b3b8;--line:#3e4042;--acc:#2d88ff;--accInk:#fff}}
:root[data-theme="dark"]{--bg:#18191a;--panel:#242526;--ink:#e4e6eb;--mute:#b0b3b8;--line:#3e4042;--acc:#2d88ff;--accInk:#fff}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:4px 0 14px;font-weight:700}
.stage,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
.panel{padding:14px;margin-top:12px}
canvas{display:block;width:100%;height:auto;border-radius:8px}
label{display:block;font-size:.85rem;color:var(--mute);margin:12px 0 4px}
label:first-child{margin-top:0}
textarea,input[type=text],select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:96px;resize:vertical;font-size:1.05rem}
input[type=range]{width:100%;accent-color:var(--acc)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:320px;overflow-y:auto;padding:2px}
.tabs button{font:inherit;font-weight:700;padding:11px 4px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.tabs button[aria-pressed=true]{border-color:var(--acc);background:var(--acc);color:var(--accInk)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{display:none;gap:10px}
.sw button{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);cursor:pointer}
.sw button[aria-pressed=true]{border-color:var(--acc)}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--ink);font-size:.95rem}
.chk input{width:20px;height:20px;accent-color:var(--acc)}
.btn{font:inherit;font-weight:700;width:100%;padding:14px;border-radius:12px;border:0;background:var(--acc);color:var(--accInk);cursor:pointer;margin-top:10px;font-size:1.05rem}
.btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px;z-index:5;overflow:auto}
#modal img{max-width:100%;max-height:75vh;border-radius:8px}
#modal p{color:#fff;margin:0;text-align:center}
input[type=color]{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:3px;cursor:pointer}
</style>
</head>
<body>

</div>
<div class="panel">
<label>কার্ডের ডিজাইন</label>

<button data-t="girl">মেয়েদের</button><button data-t="minimal">Minimal</button><button data-t="news">News</button>

<div class="row"><div><label for="c_b1">ব্যাকগ্রাউন্ড রঙ ১</label><input id="c_b1" type="color" value="#1f2937"></div><div><label for="c_b2">ব্যাকগ্রাউন্ড রঙ ২</label><input id="c_b2" type="color" value="#111827"></div></div>
<div class="row"><div><label for="c_ink">লেখার রঙ</label><input id="c_ink" type="color" value="#ffffff"></div><div><label for="c_acc">সাজের রঙ (ফ্রেম, দাগ)</label><input id="c_acc" type="color" value="#fbbf24"></div></div>
<div class="row"><div><label for="c_fr">ফ্রেম</label><select id="c_fr"><option value="none">নাই</option><option value="frame">সাধারণ</option><option value="dbl">ডাবল</option><option value="round" selected>গোল কোণা</option><option value="neon">নিয়ন</option><option value="corner">কোণা</option></select></div><div><label for="c_pt">প্যাটার্ন</label><select id="c_pt"><option value="none">নাই</option><option value="dots">ফোঁটা</option><option value="stripe">তির্যক দাগ</option><option value="circle">বড় বৃত্ত</option></select></div></div>

<div><label for="align">লেখা সাজানো</label><select id="align"><option value="auto">ডিজাইন অনুযায়ী</option><option value="center">মাঝখানে</option><option value="left">বাম দিকে</option></select></div>

<div class="row"><div><label for="fx">লেখার স্টাইল</label><select id="fx"><option value="auto">ডিজাইন অনুযায়ী</option><option value="outline">আউটলাইন</option><option value="shadow">হার্ড ছায়া</option><option value="glow">গ্লো</option><option value="marker">হাইলাইট ব্যাকগ্রাউন্ড</option><option value="line">নিচে দাগ</option></select></div><div><label for="logo">লোগো (ইচ্ছা হলে)</label><input id="logo" type="file" accept="image/*"></div></div>
<div class="row">
<div><label for="ratio">সাইজ</label><select id="ratio"><option value="1080">Square 1:1</option><option value="1350">Portrait 4:5</option></select></div>
<div><label for="grp">গ্রুপের নাম</label><input id="grp" type="text" value="💁‍♀️আমরা সিলেটি ফুয়া ফুড়িন🙋‍♂️"></div>
</div>
<label class="chk"><input id="btop" type="checkbox" checked> উপরে লোগো / গ্রুপের নাম দেখাও</label>

<label class="chk"><input id="wm" type="checkbox" checked> সারা কার্ডে গ্রুপের নাম (কেটে অন্য গ্রুপে দেওয়া যাবে না)</label>
<label for="size">লেখার সাইজ</label><input id="size" type="range" min="40" max="130" value="76">
<label for="dark">ছবি কতটা অন্ধকার</label><input id="dark" type="range" min="0" max="80" value="20">
<label for="zoom">ছবি জুম</label><input id="zoom" type="range" min="100" max="250" value="100">

</main>
<div id="modal"><p>ছবির উপর চেপে ধরে "Save image" করো</p><img id="out" alt="কার্ড"><button class="btn alt" id="close" style="max-width:240px">বন্ধ করো</button></div>

funny:['বিয়ার আগে কইছিল চান্দ আইনা দিমু,\nএখন বাজারের ব্যাগই আমারে টানাইতাছে','সিলেটের মানুষ রাগ করলে\nচা খাইয়া ঠান্ডা হয়','ডায়েট শুরু করুম কাইল,\nআজকা বিরিয়ানির শেষ দিন।','মোবাইলে চার্জ নাই,\nপকেটেও টাকা নাই, মিল আছে।','কইছিলাম ১০ মিনিটে আইতাছি,\nএখনো ঘর থেকে বাইর হই নাই।'],
sarcasm:['হ, আপনে তো সবকিছু জানেন।\nগুগলও আপনার কাছে ক্লাস করে।','বাহ! কী সুন্দর যুক্তি,\nশুইনা নিজেরই জ্ঞান বাড়ি গেল।','আপনার পরামর্শ খুব দামি,\nতাই জমাইয়া রাখলাম, ব্যবহার করুম না।','সবাই ব্যস্ত, শুধু আমার পোস্টে\nকমেন্ট করার সময় আছে।','ধন্যবাদ জ্ঞান দেওয়ার জন্য,\nআমার ঘাটতিটা আজই পূরণ হইল।'],
minimal:['ভালা থাকিও, সুখে থাকিও,\nআর মাঝে মাঝে নিজের খবরও লইও।','সহজ থাকো,\nসবকিছু কঠিন করার দরকার নাই।','আজকের দিনডা ভালা কাটুক।','কম কও, ভালা কও।','নিজের গতিতে চলো,\nপৌঁছাইবাই ঠিকই।'],

function rnd(i){const x=Math.sin(i*127.1)*43758.5453;return x-Math.floor(x)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function wrap(text,maxW){const out=[];text.split('\n').forEach(p=>{let line='';p.split(' ').forEach(w=>{const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t});out.push(line)});return out}
